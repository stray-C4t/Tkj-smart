<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Video - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='hp.css') }}">
</head>
<body style="padding: 40px; display: block;" class="login-body">
    <div class="finisher-header" id="full-bg"></div>
    <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h2 style="margin-top:0;">Tambah Video Tutorial</h2>
        <hr>
        <form action="/admin/save-video" method="POST">
            <div class="form-group">
                <label>Judul Video</label>
                <input type="text" name="judul" class="form-control" placeholder="Contoh: Tutorial Dasar Linux" required>
            </div>
            <div class="form-group">
                <label>YouTube Video ID</label>
                <input type="text" name="youtube_id" class="form-control" placeholder="Contoh: dQw4w9WgXcQ" required>
                <small class="text-muted">Ambil kode unik setelah tanda <b>v=</b> di link YouTube.</small>
            </div>
            <div class="form-group">
                <label>Durasi</label>
                <input type="text" name="durasi" class="form-control" placeholder="Contoh: 12:45">
            </div>
            <div class="form-group">
                <label>Deskripsi</label>
                <textarea name="deskripsi" class="form-control" rows="3"></textarea>
            </div>
            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-success" style="width: 200px;">Publikasikan Video</button>
                <a href="/admin/dashboard" class="btn btn-light">Batal</a>
            </div>
        </form>
    </div>
    <script id="video-data" type="application/json">
        {{ {
            "isEdit": is_edit,
            "video": video
        } | tojson | safe }}
    </script>
    <script src="{{ url_for('static', filename='Js/form-video.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/finisher-header.es5.min.js') }}"></script>
</body>
</html>
