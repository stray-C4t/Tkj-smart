<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Akun - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='form_akun.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='hp.css') }}">
</head>
<body style="display: block; padding: 30px;" class="login-body">
	<div class="finisher-header" id="full-bg"></div>
    <div style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">Tambah Akun</h2>
        <form method="POST" action="{{ '/admin/update-user/' + user.id|string if is_edit else '/admin/save-account' }}">
			<div class="form-group">
				<label>Nama Lengkap</label>
				<input type="text" name="nama_lengkap" class="form-control" placeholder="Nama Asli Siswa" required>
			</div>
			<div class="form-group">
				<label>Username</label>
				<input type="text" name="username" class="form-control" required>
			</div>
			<div class="form-group">
				<label>Password</label>
				<input type="password" name="password" class="form-control" required>
			</div>
			<div class="form-group">
				<label>Kelas</label>
				<select name="kelas" class="form-control" required>

					<option value="X TKJ 1" {% if user.kelas == 'X TKJ 1' %}selected{% endif %}>X TKJ 1</option>
					<option value="X TKJ 2" {% if user.kelas == 'X TKJ 2' %}selected{% endif %}>X TKJ 2</option>
					<option value="X TKJ 3" {% if user.kelas == 'X TKJ 3' %}selected{% endif %}>X TKJ 3</option>
					<option value="X TKJ 4" {% if user.kelas == 'X TKJ 4' %}selected{% endif %}>X TKJ 4</option>

					<option value="XI TKJ 1" {% if user.kelas == 'XI TKJ 1' %}selected{% endif %}>XI TKJ 1</option>
					<option value="XI TKJ 2" {% if user.kelas == 'XI TKJ 2' %}selected{% endif %}>XI TKJ 2</option>
					<option value="XI TKJ 3" {% if user.kelas == 'XI TKJ 3' %}selected{% endif %}>XI TKJ 3</option>
					<option value="XI TKJ 4" {% if user.kelas == 'XI TKJ 4' %}selected{% endif %}>XI TKJ 4</option>

					<option value="XII TKJ 1" {% if user.kelas == 'XII TKJ 1' %}selected{% endif %}>XII TKJ 1</option>
					<option value="XII TKJ 2" {% if user.kelas == 'XII TKJ 2' %}selected{% endif %}>XII TKJ 2</option>
					<option value="XII TKJ 3" {% if user.kelas == 'XII TKJ 3' %}selected{% endif %}>XII TKJ 3</option>
					<option value="XII TKJ 4" {% if user.kelas == 'XII TKJ 4' %}selected{% endif %}>XII TKJ 4</option>
					<option value="Guru/Admin" {% if user.kelas == 'Guru/Admin' %}selected{% endif %}>Guru/Admin</option>

				</select>
			</div>
			<div class="form-group">
				<label>Role / Jabatan</label>
				<select name="role" class="form-control">
					<option value="siswa">Siswa</option>
					<option value="admin">Admin / Guru</option>
				</select>
			</div>
			<button type="submit" class="btn btn-primary btn-block">Simpan Akun</button>
		</form>
    </div>
	<script src="{{ url_for('static', filename='Js/finisher-header.es5.min.js') }}"></script>
    <script id="form-data" type="application/json">
		{{ {
			"isEdit": is_edit,
			"user": user
		} | tojson | safe }}
	</script>
	<script src="{{ url_for('static', filename='Js/form-akun.js') }}"></script>
</body>
</html>
