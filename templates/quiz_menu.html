<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Quiz - TKJ Smart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='html.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='hp.css') }}">
</head>
<body>

    <div class="top-section">
        <div class="container">
            <nav class="top-nav">
                <a href="/dashboard" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Kembali ke Dashboard
                </a>
            </nav>

            <header class="header">
                <h1>Uji Kemampuanmu</h1>
                <p>Pilih kuis sesuai materi yang sudah kamu pelajari untuk mengasah keahlianmu.</p>
            </header>
        </div>
    </div>

    <div class="bottom-section">
        <div class="search-wrapper">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchQuiz" placeholder="Search quiz...">
            </div>
        </div>
        <div class="stars" id="star-container"></div>
        <div class="container">
            <div class="quiz-grid">
                {% for q in quiz_list %}
                <div class="quiz-card reveal">
                    <div class="quiz-icon">
                        <i class="{{ q.icon }}"></i>
                    </div>
                    <h3>{{ q.judul }}</h3>
                    <p>{{ q.soal_count }} Pertanyaan</p>
                    <a href="/quiz/kerjakan/{{ q.id }}" class="btn-start">Mulai Kuis</a>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='Js/bintang.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/ajax-quiz.js') }}"></script>
    <script src="{{ url_for('static', filename='Js/reveal.js') }}"></script>
</body>
</html>
